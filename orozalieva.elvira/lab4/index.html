<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Blog Posts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Блог</h1>

      <!-- Форма добавления поста -->
      <form data-testid="entity-form" id="add-post-form">
        <input
          type="text"
          name="title"
          placeholder="Заголовок поста"
          required
        />
        <button type="submit">Добавить пост</button>
      </form>

      <!-- Список карточек -->
      <div data-testid="entity-list" id="posts-container"></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
